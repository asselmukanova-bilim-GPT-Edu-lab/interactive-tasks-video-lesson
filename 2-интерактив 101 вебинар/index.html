<!doctype html>
<html lang="kk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141a5c" />
    <meta name="description" content="Мұғалімдерге арналған интерактивті промпт құрастыру ойыны" />
    <title>Промпт құрастыру</title>
    <link rel="stylesheet" href="styles.css?v=3" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <span class="brand-mark" aria-hidden="true">7</span>
        <strong>Промпт құрастыру</strong>
        <button class="close-game" id="closeGame" type="button" aria-label="Ойынды жабу">×</button>
      </header>
      <div class="game-root" id="gameRoot"></div>
      <footer class="game-footer">
        <button class="reset-link" id="resetGame" type="button">Қайта бастау</button>
      </footer>
      <div class="live-region" id="liveRegion" aria-live="polite"></div>
    </main>
    <script src="script.js?v=3"></script>
  </body>
</html>
